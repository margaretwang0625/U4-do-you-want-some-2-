
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>皮卡丘隊 vs 伊布隊｜英文猜食物遊戲</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#fff7bc,#e8f5ff,#f9e7ff);
  color:#433526;text-align:center;padding:16px;
}
h1{margin:8px 0;color:#6a4a25}
.subtitle{font-size:1.1rem;margin:8px}
.teams{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;margin:20px auto}
.team{width:min(40%,260px);min-width:145px;padding:12px;border-radius:22px;background:#ffffffb8}
.pika{background:#fff1a6}
.eevee{background:#f4dfca}
.character{
  width:100%;height:180px;object-fit:contain;
  border:0;background:transparent;display:block;
}
.score{font-size:2rem;font-weight:bold}
.vs{font-size:2rem;font-weight:bold;color:#e66c39}
button,select{
  font:inherit;border:0;border-radius:14px;padding:12px 16px;
  cursor:pointer;margin:5px;background:#fff;box-shadow:0 3px 0 #d5c5a9;
}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#ffdc54;font-weight:bold}
.prompt{font-size:clamp(1.3rem,4vw,2rem);font-weight:bold;margin:20px 0}
.foods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:900px;margin:18px auto}
.food{
  border:3px solid white;border-radius:18px;padding:10px 4px;
  background:#ffffffc9;box-shadow:0 3px 8px #0001;
}
.food .emoji{font-size:clamp(2.8rem,8vw,5rem);line-height:1.3}
.food .name{font-size:1rem;font-weight:bold}
.food.chosen{outline:5px solid #ffbf00;background:#fff5c7}
.food.correct{background:#d8ffd9}
.food.wrong{opacity:.5}
.panel{max-width:760px;margin:14px auto;padding:16px;border-radius:20px;background:#ffffffbd}
#message{min-height:2.5em;font-size:1.15rem;font-weight:bold}
.small{font-size:.9rem;color:#715f4d}
#effect{font-size:2.4rem;min-height:1.5em}
.lightning{animation:zap .6s ease-in-out 3}
.evolution{animation:evo .9s ease-in-out 2}
@keyframes zap{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.3);filter:drop-shadow(0 0 15px gold)}}
@keyframes evo{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(8deg);filter:drop-shadow(0 0 18px #ffca55)}100%{transform:scale(1) rotate(0)}}
@media(max-width:550px){
 .foods{grid-template-columns:repeat(2,minmax(0,1fr))}
 .character{height:130px}
 .team{width:42%;min-width:125px}
}
</style>
</head>
<body>
<h1>⚡ 皮卡丘隊 vs 伊布隊 ⭐</h1>
<div class="subtitle">Do you want some ______?</div>
<div class="teams">
  <div class="team pika">
    <div style="font-weight:bold">⚡ 皮卡丘隊</div>
    <img class="character" alt="皮卡丘" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png">
    <div class="score" id="pikaScore">0</div>
    <div class="small">分數</div>
  </div>
  <div class="vs">VS</div>
  <div class="team eevee">
    <div style="font-weight:bold">⭐ 伊布隊</div>
    <img class="character" alt="伊布" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/133.png">
    <div class="score" id="eeveeScore">0</div>
    <div class="small">分數</div>
  </div>
</div>

<div class="panel">
  <div id="setup">
    <h2 id="setupTitle">皮卡丘隊，請設定秘密食物</h2>
    <p>選擇一種食物，再把畫面交給另一隊猜！</p>
    <div id="setupFoods" class="foods"></div>
    <button class="primary" id="confirmSecret" disabled>確認秘密食物</button>
  </div>

  <div id="playing" hidden>
    <div class="prompt" id="question">Do you want some juice?</div>
    <div id="effect"></div>
    <div id="message">請選擇你要猜的食物。</div>
    <div id="guessFoods" class="foods"></div>
    <p id="attempts"></p>
    <button id="nextRound" class="primary" hidden>下一回合</button>
  </div>

  <button id="soundToggle">🔊 音效：開</button>
  <button id="reset">重新開始</button>
</div>
<p class="small">每回合由一隊設定秘密食物，另一隊最多猜 3 次。答對得 10 分！</p>

<script>
const foods=[
 {name:"juice",emoji:"🧃"},
 {name:"milk",emoji:"🥛"},
 {name:"tea",emoji:"🍵"},
 {name:"water",emoji:"💧"},
 {name:"cake",emoji:"🍰"},
 {name:"ice cream",emoji:"🍦"},
 {name:"pizza",emoji:"🍕"},
 {name:"rice",emoji:"🍚"}
];
const teams=[
 {name:"皮卡丘隊",key:"pika",score:0},
 {name:"伊布隊",key:"eevee",score:0}
];
let round=0,secret=null,guesses=0,finished=false,selected=null;
let soundOn=true,audio=null,roundsWon=0;
const $=id=>document.getElementById(id);

function beep(freq=600,duration=.15){
 if(!soundOn)return;
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.frequency.value=freq;osc.type="sine";
  gain.gain.value=.08;osc.connect(gain);gain.connect(audio.destination);
  osc.start();osc.stop(audio.currentTime+duration);
 }catch(e){}
}
function speak(text){
 if(soundOn&&"speechSynthesis" in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=.85;speechSynthesis.speak(u);
 }
}
function currentSetter(){return teams[round%2]}
function currentGuesser(){return teams[(round+1)%2]}

function foodCard(food,handler,extra=""){
 const b=document.createElement("button");
 b.className="food "+extra;
 b.innerHTML=`<div class="emoji">${food.emoji}</div><div class="name">${food.name}</div>`;
 b.onclick=handler;
 return b;
}
function renderSetup(){
 $("setup").hidden=false;$("playing").hidden=true;
 $("setupTitle").textContent=currentSetter().name+"，請設定秘密食物";
 $("setupFoods").innerHTML="";
 selected=null;$("confirmSecret").disabled=true;
 foods.forEach(f=>{
  $("setupFoods").appendChild(foodCard(f,()=>{
   selected=f;
   [...$("setupFoods").children].forEach(c=>c.classList.remove("chosen"));
   [...$("setupFoods").children].find(c=>c.querySelector(".name").textContent===f.name).classList.add("chosen");
   $("confirmSecret").disabled=false;
   beep(500);
  }));
 });
}
function beginGuess(){
 if(!selected)return;
 secret=selected;guesses=0;finished=false;
 $("setup").hidden=true;$("playing").hidden=false;
 $("message").textContent=currentGuesser().name+"，請猜秘密食物！";
 $("question").textContent="Do you want some ______?";
 $("effect").textContent="";
 $("attempts").textContent="剩餘猜測次數：3";
 $("nextRound").hidden=true;
 renderGuessFoods();
}
function renderGuessFoods(){
 $("guessFoods").innerHTML="";
 foods.forEach(f=>{
  const b=foodCard(f,()=>guess(f,b));
  $("guessFoods").appendChild(b);
 });
}
function guess(food,button){
 if(finished)return;
 guesses++;
 const right=food.name===secret.name;
 [...$("guessFoods").children].forEach(b=>b.disabled=true);
 $("question").textContent=`Do you want some ${food.name}?`;
 $("attempts").textContent=`已猜 ${guesses} 次／最多 3 次`;
 if(right){
  finished=true;
  $("message").textContent="Yes, I do!";
  $("effect").textContent=currentSetter().key==="pika"?"⚡⚡⚡ 十萬伏特！ ⚡⚡⚡":"✨⭐ 進化之光！ ⭐✨";
  $("effect").className=currentSetter().key==="pika"?"lightning":"evolution";
  button.classList.add("correct");
  speak("Yes, I do!");
  beep(880,.3);setTimeout(()=>beep(1100,.35),180);
  currentSetter().score+=10;
  $("pikaScore").textContent=teams[0].score;
  $("eeveeScore").textContent=teams[1].score;
  if(currentSetter().score%30===0){
   $("message").textContent="Yes, I do! +10 分！升級！";
   setTimeout(()=>{beep(700,.2);beep(900,.2);beep(1200,.3)},250);
  }else{
   $("message").textContent="Yes, I do! +10 分！";
  }
  roundsWon++;
  if(currentSetter().key==="eevee"){
   const themes=["💧 水之進化！","⚡ 雷之進化！","🔥 火之進化！"];
   $("effect").textContent=themes[(roundsWon-1)%themes.length];
  }
  $("nextRound").hidden=false;
 }else{
  button.classList.add("wrong");
  $("message").textContent="No, I don't.";
  speak("No, I don't.");
  beep(260,.18);
  if(guesses>=3){
   finished=true;
   $("message").textContent="三次機會已用完！秘密食物是 "+secret.name+"。";
   $("effect").textContent=secret.emoji;
   $("nextRound").hidden=false;
  }else{
   [...$("guessFoods").children].forEach(b=>b.disabled=false);
   button.disabled=true;
   $("attempts").textContent=`剩餘猜測次數：${3-guesses}`;
  }
 }
}
$("confirmSecret").onclick=beginGuess;
$("nextRound").onclick=()=>{
 round++;
 renderSetup();
};
$("soundToggle").onclick=()=>{
 soundOn=!soundOn;
 $("soundToggle").textContent=soundOn?"🔊 音效：開":"🔇 音效：關";
 if(!soundOn&&"speechSynthesis" in window)speechSynthesis.cancel();
};
$("reset").onclick=()=>{
 if("speechSynthesis" in window)speechSynthesis.cancel();
 round=0;guesses=0;secret=null;selected=null;finished=false;roundsWon=0;
 teams.forEach(t=>t.score=0);
 $("pikaScore").textContent="0";$("eeveeScore").textContent="0";
 renderSetup();
};
renderSetup();
</script>
</body>
</html>
